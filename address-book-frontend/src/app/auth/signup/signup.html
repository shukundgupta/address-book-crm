<div class="login-wrapper">

  <div class="bg"></div>

  <div class="login-card">

    <img src="assets/app-logo.png" class="logo" />

    <h2>Create Account</h2>
    <p class="subtitle">Join your CRM</p>

    <form (ngSubmit)="!otpSent ? sendOtp() : verifyOtp()">
      <input name="name" placeholder="Full Name" [(ngModel)]="name" required />
      
      <div class="input-group">
        <input 
          type="email" 
          name="email" 
          placeholder="Email Address" 
          [(ngModel)]="email" 
          #emailRef="ngModel"
          required 
          email
        />
        <div class="error-text" *ngIf="emailRef.invalid && (emailRef.dirty || emailRef.touched)">
          Please enter a valid email address
        </div>
      </div>

      <select name="company_id" [(ngModel)]="company_id" required>
        <option value="">Select Company</option>
        <option value="1">Komal Chemiequip Pvt. Ltd.</option>
        <option value="2">Arnav Agencies</option>
      </select>

      <input name="password" type="password" placeholder="Password" [(ngModel)]="password" required />

      <!-- 🔥 SINGLE CONTROL BLOCK (IMPORTANT) -->
      <ng-container *ngIf="otpSent; else sendOtpBlock">

        <!-- OTP SECTION -->
        <div class="otp-box">
          <input *ngFor="let _ of [0,1,2,3,4,5]; let i = index"
                maxlength="1"
                class="otp-input"
                (keydown)="onOtpKeyDown($event, i)"
                autocomplete="one-time-code"
                inputmode="numeric" />
        </div>

        <div class="timer">
          <span>Expires in {{timer}}s</span>
          <button type="button"
                  class="link-btn"
                  (click)="sendOtp()"
                  [disabled]="timer > 0">
            Resend
          </button>
        </div>

        <button type="submit"
                class="primary-btn"
                *ngIf="!otpVerified"
                [disabled]="loading">
          <span *ngIf="!loading">Verify OTP</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

      </ng-container>

      <!-- SEND OTP BUTTON -->
      <ng-template #sendOtpBlock>
        <button type="submit" class="primary-btn" [disabled]="loading">
          <span *ngIf="!loading">Send OTP</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </ng-template>
    </form>

    <!-- REGISTER -->

    <div class="auth-switch">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>

  </div>

</div>
